appId: com.yijing.aieditor
productName: YiJingAIEditor
copyright: (c) 2026 艺镜 AI 团队

directories:
  buildResources: build
  # 为什么不是 dist-win：本机 dist-win/win-unpacked/resources/app.asar 长期被某个进程
  # 独占（Device or resource busy，tasklist 查不到、rm -rf 也被拦），electron-builder
  # 在"清空旧产物"这一步必定失败。换个目录名绕开这个死结，产物路径从此与
  # "上一次有没有残留"无关 —— 这本来就是打包该有的性质。
  output: dist-app

asar: true
compression: maximum

# 本应用没有任何生产依赖（依赖全部在 renderer 构建期被打进 dist-renderer），
# 因此不需要 electron-builder 去 spawn npm 做 rebuild / 依赖安装。
# 关掉这两步既省时间，也避免它在本机 npm 环境下卡死（ERR_ELECTRON_BUILDER_CANNOT_EXECUTE）。
npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false

files:
  - src/main/**/*
  - src/preload/**/*
  # ⚠️ src/shared/ 必须随包 —— 主进程侧有 5 个模块在**运行期** require 它：
  #    looks.js → shared/looks.json
  #    subtitles.js → shared/textStyles.json, shared/textOverrides.js
  #    render.js → shared/pip.json, shared/speed.js, shared/adjust.js,
  #                shared/effects.js, shared/aspect.js
  #    mcp-server.js → shared/aspect.js, shared/effects.js
  #    渲染层是构建期被打进 dist-renderer 的，**看不见**这份运行期依赖 ——
  #    所以漏掉它开发模式一切正常，装出来的 exe 里一导出就崩（MODULE_NOT_FOUND）。
  - src/shared/**/*
  - dist-renderer/**/*
  # 图标必须随包：窗口 icon 与托盘（通知区）都按 `../../build/icon.ico` 取它。
  # 漏了不报错 —— 窗口照样开、exe 也照样有图标（那是 electron-builder 直接写进
  # 资源的），只有**托盘是空白**、窗口图标缺失，而这种"只在打包后才出现"的差别
  # 在开发模式下永远看不到。
  - build/icon.ico
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,__tests__,tests,example,examples,docs}/**'
  # 取证/侦察目录：`_recon/`（参考截图、Chromium 会话残留，量级 GB）与 `_evidence/`（闸门日志）。
  # 上面是**白名单**，理论上它们本来就进不来；这里显式再写一遍，是因为白名单一旦
  # 被人图省事改成 `**/*`，这两个目录会**立刻**混进安装包 —— 显式排除在那种情况下仍然生效。
  # 来源：2026-10-02 PM 审查 P1-3（_recon 实测 3,675.6MB / _evidence 152.4MB）。
  - '!_recon/**/*'
  - '!_evidence/**/*'
  # 占位素材清单 PLACEHOLDERS.json 原先也在这里显式排除。它随「全部图形资产改为自建」
  # 一起删除了（图标 / 配图 / 素材缩略图现在都由 tools/ 下的脚本程序生成），
  # 这条排除项留着只是指向一个不存在的文件。

# ffmpeg 随包目录（**可选**）。
# 目录本身常驻仓库（里面有 README.txt 说明怎么拿 ffmpeg），所以这里的 from 一定存在。
# 里面**有** ffmpeg.exe 时随包带走、没有就只有一个 README —— 不影响打包。
# ⚠️ 为什么不是"构建时自动下载"：ffmpeg 是 LGPL/GPL，本项目是 MIT，
#    默认把 GPL 二进制打进 MIT 发行物会让许可证说不清。决定权留在打包者手上，
#    见 tools/fetch-ffmpeg.mjs 的说明。
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
  # 内置贴纸库（Noto Animated Emoji 静态 512 帧，Apache-2.0）。
  # 走 extraResources 而不是 files：它是**数据**不是代码，140 个 PNG 塞进 asar 里
  # 既拖慢启动解包，也让"素材坏了要替换"变成必须重新打包。
  # ⚠️ 主进程侧按 `process.resourcesPath/stickers` 找它；开发模式那里没有，
  #    会回退到 `appPath/resources/stickers`（见 main/stickers.js 的 stickerRootOf）。
  - from: resources/stickers
    to: stickers
    filter:
      - '**/*.png'
      - 'catalog.json'
      # Apache-2.0 要求随分发物保留声明。漏了它不影响功能，
      # 但"素材是谁的"就查不到了 —— 而这类问题只在被追问时才发现。
      - 'LICENSE.txt'

  # 内置边框库（24 款，`tools/gen-borders.py` 程序生成，项目自有版权）。
  # 同样走 extraResources：它是**数据**，且"加一款边框"不该要求重新打包 asar。
  # ⚠️ 与贴纸同一个坑：主进程按 `process.resourcesPath/borders` 找，
  #    开发模式那里没有、会回退到 `<main>/../../resources/borders`（见 main/materialPack.js）。
  - from: resources/borders
    to: borders
    filter:
      - '**/*.png'
      - 'catalog.json'

  # 人物特效的运行时（MediaPipe wasm 13.8MB + 模型 3.6MB，Apache-2.0）。
  # ⚠️ 这两个文件**不入 git 仓库**，要先 `node tools/fetch-mediapipe.mjs`。
  #    漏抓就打包的话，装出来的包里没有它们：开发模式一切正常（从 node_modules 读），
  #    只在安装版里点「识别人脸」报"运行时缺失" —— 正是 facefx:runtime 要提前说清的那种。
  - from: resources/mediapipe
    to: mediapipe
    filter:
      - '*.wasm'
      - '*.task'
      - '*.js'
      - 'LICENSE.txt'
      - 'README.txt'

  # 人物特效的两枚贴图（遮罩 / 描边），程序生成、入库。
  - from: resources/facefx
    to: facefx
    filter:
      - '**/*.png'

extraMetadata:
  name: YiJingAIEditor
  description: 艺镜AI剪辑 · AI 视频创作与剪辑工作台

win:
  target:
    - target: dir
      arch:
        - x64
  icon: build/icon.ico
  artifactName: YiJingAIEditor-${version}-Windows-${arch}.${ext}
  requestedExecutionLevel: asInvoker

mac:
  category: public.app-category.video
  target:
    - target: dir
      arch:
        - x64
        - arm64
  icon: build/icon.ico

linux:
  target:
    - dir
  category: AudioVideo
  icon: build/icon.ico
